services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shibaquiz
      POSTGRES_USER: shibaquiz
      POSTGRES_PASSWORD: shibaquiz
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shibaquiz -d shibaquiz"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - shibaquiz-postgres:/var/lib/postgresql/data

volumes:
  shibaquiz-postgres:
